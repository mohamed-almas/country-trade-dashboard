name: Keep scheduled workflows alive

# GitHub disables scheduled workflows after 60 days without repo activity. Re-enabling a workflow through the API
# counts as activity, so this weekly job re-enables the Comtrade refresh (and itself) and the schedule never lapses.
on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable comtrade-sync.yml --repo "$GITHUB_REPOSITORY"
          gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
