# Retrigger: rebuild preview with sidebar theme + choropleth maps
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main, redesign]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout redesign
        uses: actions/checkout@v4
        with:
          ref: redesign
          path: site-redesign

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build main (site root)
        working-directory: site-main/app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - name: Build redesign (preview subpath)
        working-directory: site-redesign/app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/preview/
        run: |
          npm ci
          npm run build

      - name: Combine into single site
        run: |
          mkdir -p site/preview
          cp -r site-main/app/dist/. site/
          cp -r site-redesign/app/dist/. site/preview/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
